<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#d9480f">
<title>Справочник диспетчера</title>
<style>
:root{--bg:#eef0ed;--surface:#fff;--fg:#16191b;--muted:#5d655f;--line:#cfd4ce;--accent:#d9480f;--accent-ink:#fff;--bad:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121517;--surface:#1b1f22;--fg:#e8ebe7;--muted:#9aa29c;--line:#2c3236;--accent:#ff7a3d;--accent-ink:#1a0d06;--bad:#ff7b72;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{min-height:100%;display:grid;place-items:center;padding:24px 16px}
form{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px 20px;display:grid;gap:12px}
h1{margin:0;font-size:22px;line-height:1.2}
p{margin:0;color:var(--muted);font-size:14.5px}
input[type=password]{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:0 14px;font-size:16px}
label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
button{height:48px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;cursor:pointer}
.err{color:var(--bad);font-size:14px;min-height:1.2em}
.hazard{height:6px;border-radius:3px;background:repeating-linear-gradient(-45deg,var(--accent) 0 10px,transparent 10px 20px)}
</style>
</head>
<body>
<main><form id="f" hidden>
  <div class="hazard" aria-hidden="true"></div>
  <h1>Справочник диспетчера</h1>
  <p>Доступ по ссылке. Откройте полную ссылку, которую вам прислали, или введите ключ.</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Ключ доступа" aria-label="Ключ доступа">
  <label><input id="rem" type="checkbox" checked> Запомнить на этом устройстве</label>
  <div class="err" id="err" role="alert"></div>
  <button type="submit">Открыть</button>
</form></main>

<script>
(async function(){
  const P = JSON.parse(document.getElementById('p').textContent);
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const LS = 'kolja_key';
  const get = () => { try { return localStorage.getItem(LS) } catch(e) { return null } };
  const put = v => { try { v ? localStorage.setItem(LS, v) : localStorage.removeItem(LS) } catch(e) {} };
  async function unlock(pw){
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(P.s), iterations:P.n, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.i)}, key, b64(P.c)));
  }
  function show(html){
    // ключ убираем из адресной строки, чтобы он не остался в истории и не мешал разделам
    try { history.replaceState(null, '', location.pathname + location.search); } catch(e) {}
    document.open(); document.write(html); document.close();
  }
  const f = document.getElementById('f'), err = document.getElementById('err');
  if (!(window.crypto && crypto.subtle)) { f.hidden = false; err.textContent = 'Откройте ссылку в браузере по адресу, начинающемуся с https://'; return; }
  const m = location.hash.match(/k=([A-Za-z0-9_-]+)/);
  const auto = m ? m[1] : get();
  if (auto) {
    try { const html = await unlock(auto); if (m) put(auto); show(html); return; }
    catch(e) { if (!m) put(null); err.textContent = m ? 'Ссылка устарела или скопирована не полностью.' : ''; }
  }
  f.hidden = false;
  f.addEventListener('submit', async e => {
    e.preventDefault(); err.textContent = '';
    const pw = document.getElementById('pw').value.trim(); if (!pw) return;
    try { const html = await unlock(pw); if (document.getElementById('rem').checked) put(pw); show(html); }
    catch(x) { err.textContent = 'Ключ не подошёл. Проверьте и попробуйте ещё раз.'; }
  });
})();
</script>
